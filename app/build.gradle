plugins { id 'com.android.application' }

android {
    namespace 'com.lge.lgmdmservice'
    compileSdk 35
    lint {
        // This sideloaded app targets Android 5.1 compatibility permissions on Android 6 devices.
        disable 'ExpiredTargetSdkVersion'
    }
    defaultConfig {
        applicationId 'com.lge.lginstallservies'
        minSdk 23
        // Keep the legacy target level for Android 6 device compatibility.
        targetSdk 22
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 8
        versionName '2.6'
    }

    signingConfigs {
        release {
            def keyFile = System.getenv('YW_KEYSTORE_FILE')
            if (keyFile != null && !keyFile.isEmpty()) {
                storeFile file(keyFile)
                storePassword System.getenv('YW_KEYSTORE_PASSWORD')
                keyAlias System.getenv('YW_KEY_ALIAS')
                keyPassword System.getenv('YW_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('YW_KEYSTORE_FILE') != null && !System.getenv('YW_KEYSTORE_FILE').isEmpty()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}