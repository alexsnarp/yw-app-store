name: Android build
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Run Android lint
        run: gradle --no-daemon lintDebug
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Android 6 startup smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          arch: x86
          profile: Nexus 6
          script: gradle --no-daemon connectedDebugAndroidTest
      - name: Package source ZIP
        run: git archive --format=zip --output=yw-app-store-source.zip HEAD
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: yw-app-store-source
          path: yw-app-store-source.zip
          if-no-files-found: error
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yw-app-store-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
